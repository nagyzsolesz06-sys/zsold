name: Árfolyamfrissítés

on:
  schedule:
    - cron: '17 5-20 * * *'   # óránként 7:17 és 22:17 között (budapesti nyári idő szerint), minden nap
  workflow_dispatch:           # kézi indítás: Actions → Árfolyamfrissítés → Run workflow
    inputs:
      mod:
        description: 'Mit futtasson'
        type: choice
        default: frissítés
        options:
          - frissítés              # a szokásos óránkénti futás
          - visszatöltés próba     # régi árak lekérése a grafikonhoz, adatbázis-írás nélkül
          - visszatöltés           # régi árak beírása a price_history táblába
  push:
    branches: [main]
    paths: ['scripts/*.mjs', '.github/workflows/update.yml']

concurrency:
  group: arfolyamfrissites
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # az időzítés életben tartásához

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Árfolyamok és árak frissítése
        if: ${{ !startsWith(inputs.mod, 'visszatöltés') }}
        run: node scripts/update.mjs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
      - name: Régi árak visszatöltése a portfólióérték-grafikonhoz
        if: ${{ startsWith(inputs.mod, 'visszatöltés') }}
        run: node scripts/backfill.mjs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          DRY_RUN: ${{ inputs.mod == 'visszatöltés próba' }}
      - name: Időzítés életben tartása (a GitHub 60 nap tétlenség után leállítaná)
        if: always()
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/enable" \
            && echo "::notice::Időzítés megerősítve"
